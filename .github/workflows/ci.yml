name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Whitespace check
        env:
          PLC_EVENT_NAME: ${{ github.event_name }}
          PLC_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-whitespace.mjs
      - name: Build and validate release candidate
        if: matrix.node == '24.x'
        run: |
          npm run build
          npm run generate:candidate-updates
          npm run validate:candidate-updates
          RELEASE_TAG="v$(node -p "require('./package.json').version")" npm run verify:release
          npm run inspect:artifacts
          version="$(node -p "require('./package.json').version")"
          unzip -t "dist/paper-library-checker-zotero-${version}.xpi"
          unzip -t "dist/paper-library-checker-extension-${version}.zip"
          npm run validate:archives:python
          sha256sum dist/*.xpi dist/*.zip > "$RUNNER_TEMP/first-build.sha256"
          npm run build
          npm run generate:candidate-updates
          npm run validate:candidate-updates
          sha256sum dist/*.xpi dist/*.zip > "$RUNNER_TEMP/second-build.sha256"
          diff -u "$RUNNER_TEMP/first-build.sha256" "$RUNNER_TEMP/second-build.sha256"
      - name: Full-history secret scan
        if: matrix.node == '24.x'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.24.3_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --log-opts="--all"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == '24.x'
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  windows-archive-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run validate:archives:windows

  canonical-artifact-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run generate:candidate-updates
      - run: PLC_INVENTORY_FILE=dist/inventory.json npm run inspect:artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-ubuntu-${{ github.sha }}
          path: |
            dist/*.xpi
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/inventory.json
            dist/candidate-updates.json
            LICENSE
          if-no-files-found: error

  canonical-artifact-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run generate:candidate-updates
      - run: $env:PLC_INVENTORY_FILE='dist/inventory.json'; npm run inspect:artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-windows-${{ github.sha }}
          path: |
            dist/*.xpi
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/inventory.json
            dist/candidate-updates.json
            LICENSE
          if-no-files-found: error

  canonical-artifact-compare:
    runs-on: ubuntu-latest
    needs: [canonical-artifact-ubuntu, canonical-artifact-windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canonical-ubuntu-${{ github.sha }}
          path: compare/ubuntu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canonical-windows-${{ github.sha }}
          path: compare/windows
      - name: Compare current candidate artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for file in \
            "dist/paper-library-checker-zotero-${version}.xpi" \
            "dist/paper-library-checker-extension-${version}.zip" \
            dist/SHA256SUMS.txt \
            dist/inventory.json \
            dist/candidate-updates.json \
            LICENSE; do
            cmp "compare/ubuntu/$file" "compare/windows/$file"
          done
          echo "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4  compare/ubuntu/LICENSE" | sha256sum -c -
      - run: npm ci
      - name: Validate candidate XPI/update closure
        run: PLC_DIST_DIR="$PWD/compare/ubuntu/dist" PLC_UPDATES_FILE="$PWD/compare/ubuntu/dist/candidate-updates.json" npm run validate:candidate-updates
      - name: Verify v0.3.0 release history and current v0.4.0 published update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/tags/v0.3.0 | cut -f1)" = "f70d2aab85ceaa7c4f312c77c7e97accccace3c6"
          gh api repos/he-chun/paper-library-checker/releases/tags/v0.3.0 \
            --jq 'select(.tag_name == "v0.3.0" and .prerelease == true) | [.assets[].name] | sort | join("\n")' \
            > "$RUNNER_TEMP/v0.3.0-assets.txt"
          grep -Fx 'paper-library-checker-extension-0.3.0.zip' "$RUNNER_TEMP/v0.3.0-assets.txt"
          grep -Fx 'paper-library-checker-zotero-0.3.0.xpi' "$RUNNER_TEMP/v0.3.0-assets.txt"
          curl --fail --location --silent --show-error \
            https://github.com/he-chun/paper-library-checker/releases/download/v0.3.0/paper-library-checker-zotero-0.3.0.xpi \
            --output "$RUNNER_TEMP/published.xpi"
          curl --fail --location --silent --show-error \
            https://github.com/he-chun/paper-library-checker/releases/download/v0.3.0/paper-library-checker-extension-0.3.0.zip \
            --output "$RUNNER_TEMP/published.zip"
          echo "91331ef1bcee06c34bbcadaaf956866b5c06125999da630f48f0f6837234ef59  $RUNNER_TEMP/published.xpi" | sha256sum -c -
          echo "ef69fec94e4ac8bb9de87b4b1c6ab42b226c50d895a6df893150da2f07dc9bd5  $RUNNER_TEMP/published.zip" | sha256sum -c -
          echo "57700df0e04a08b6494e96ed1644859803076c97247bacce43d5e5fd7c63693f  updates.json" | sha256sum -c -
