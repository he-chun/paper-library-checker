name: Build tagged release artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run generate:updates
      - run: npm run validate:updates
      - name: Verify tag, versions, license, notices, artifacts, and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release
      - run: npm run inspect:artifacts
      - name: Validate dynamically named archives
        run: |
          version="$(node -p "require('./package.json').version")"
          unzip -t "dist/paper-library-checker-zotero-${version}.xpi"
          unzip -t "dist/paper-library-checker-extension-${version}.zip"
      - run: npm run validate:archives:python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-library-checker-${{ github.ref_name }}
          path: |
            dist/
            updates.json
          if-no-files-found: error
