<!doctype html>
<html lang="en" data-i18n-title="optionsTitle">
  <head>
    <meta charset="utf-8">
    <title>Paper Library Checker Options</title>
    <style>
      body {
        max-width: 680px;
        margin: 32px auto;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      label {
        display: block;
        margin: 18px 0 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
      }
      input[type="radio"] {
        width: auto;
      }
      input[type="checkbox"] {
        width: auto;
      }
      button {
        margin-top: 18px;
        padding: 8px 14px;
      }
      .token-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .token-row button {
        margin-top: 0;
      }
      #status {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsHeading">Paper Library Checker</h1>
    <p data-i18n="productTagline">A third-party add-on for Zotero</p>
    <label for="endpoint" data-i18n="endpointLabel">Zotero plugin endpoint</label>
    <input id="endpoint" type="url" value="http://127.0.0.1:23119/zotero-checker">
    <label for="token" data-i18n="pairingTokenLabel">Pairing token</label>
    <div class="token-row">
      <input id="token" type="password" value="" autocomplete="off" spellcheck="false">
      <button id="toggleToken" type="button" aria-pressed="false" data-i18n="showToken">Show</button>
    </div>
    <label data-i18n="translationModeLabel">Translation-server mode</label>
    <label>
      <input type="radio" name="translationServerMode" value="off">
      <span data-i18n="translationModeOff">Off — never use translation-server</span>
    </label>
    <label>
      <input type="radio" name="translationServerMode" value="auto" checked>
      <span data-i18n="translationModeAuto">Auto — try on priority academic domains (default)</span>
    </label>
    <label>
      <input type="radio" name="translationServerMode" value="always">
      <span data-i18n="translationModeAlways">Always — try on all pages</span>
    </label>
    <label>
      <input type="checkbox" id="enablePageGlow">
      <span data-i18n="enablePageGlow">Enable page edge glow — show a colored border around the viewport based on check result</span>
    </label>
    <label>
      <input type="checkbox" id="autoCheckReferenceLists">
      <span data-i18n="autoCheckReferenceLists">Auto-check reference lists — automatically scan CNKI / ScienceDirect references on page load and scroll</span>
    </label>
    <label>
      <input type="checkbox" id="broadPageDetection">
      <span data-i18n="broadPageDetection">Detect article details on supported injected websites</span>
    </label>
    <button id="save" type="button" data-i18n="save">Save</button>
    <button id="testConnection" type="button" data-i18n="testConnection">Test connection</button>
    <span id="status" role="status" aria-live="polite"></span>
    <script src="common/i18n.js"></script>
    <script src="common/request-auth.js"></script>
    <script src="options.js"></script>
  </body>
</html>
