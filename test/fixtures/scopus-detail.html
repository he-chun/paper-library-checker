<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Scopus synthetic document details</title>
  </head>
  <body>
    <main>
      <article>
        <section data-testid="publication-page-header" hidden>
          <h2 data-testid="publication-titles">Stale Hidden Scopus Document</h2>
          <div data-testid="publication-information-bar">
            <a id="source-preview-flyout" href="#">Stale Journal</a>
            <span data-testid="publication-document-type">Article</span>
            <span data-testid="publication-year">1999</span>
            <span data-testid="publication-doi">DOI: 10.1000/stale.hidden</span>
          </div>
        </section>

        <section data-testid="publication-page-header">
          <div class="synthetic-title-wrapper">
            <h2 data-testid="publication-titles">
              <span>Synthetic Scopus Detail Study</span>
              <span class="zotero-check-search-status">Injected status noise</span>
            </h2>
          </div>
          <div data-testid="publication-information-bar">
            <a id="source-preview-flyout" href="#"><span>Journal of Synthetic Details</span></a>
            <span data-testid="publication-document-type"><span>Review</span></span>
            <span data-testid="publication-year"><span>2026</span></span>
            <span data-testid="publication-doi"><span>DOI: 10.5555/SYNTHETIC.DETAIL.</span></span>
          </div>
          <ul data-testid="authors-list">
            <li data-testid="authorItem-button"><button type="button"><span>Example, Ada</span></button></li>
            <li data-testid="authorItem-button"><button type="button"><span>Sample, Benoit</span></button></li>
            <li data-testid="authorItem-button"><button type="button"><span> example, ada </span></button></li>
            <li data-testid="authorItem-button" hidden><button type="button">Hidden, Person</button></li>
            <li><button type="button">+2 authors</button></li>
          </ul>
        </section>
      </article>
    </main>
  </body>
</html>
