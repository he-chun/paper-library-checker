<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Synthetic Web of Science full record</title>
  </head>
  <body>
    <app-full-record>
      <div id="snMainArticle" hidden>
        <h2 data-ta="FullRTa-fullRecordtitle-0">Hidden stale full record</h2>
        <span data-ta="FullRTa-DOI">10.5555/stale.hidden</span>
      </div>
    </app-full-record>

    <app-full-record>
      <div id="snMainArticle" role="region" aria-label="Full Record main content section">
        <div class="title-wrapper">
          <h2 data-ta="FullRTa-fullRecordtitle-0">
            Synthetic Web of Science Full Record
            <span class="zotero-check-search-status">Injected status noise</span>
          </h2>
        </div>
        <div data-ta="SumAuthTa-MainDiv-author-en">
          <a data-ta="SumAuthTa-DisplayName-author-en-0">Example, A</a>
          <span data-ta="SumAuthTa-FrAuthStandard-author-en-0">(Example, Ada)</span>
          <a data-ta="SumAuthTa-DisplayName-author-en-1">Sample, B</a>
          <span data-ta="SumAuthTa-FrAuthStandard-author-en-1">(Sample, Benoit)</span>
          <span data-ta="SumAuthTa-FrAuthStandard-author-en-2" hidden>(Hidden, Person)</span>
        </div>
        <div class="cdx-two-column-grid-container">
          <h3 data-ta="FullRTa-sourceLabel">Source</h3>
          <span class="section-label-data">
            <span class="source-title-display">
              <a href="/wos/woscc/general-summary?queryJson=synthetic">
                <span>JOURNAL OF SYNTHETIC DETAILS</span>
              </a>
            </span>
          </span>
        </div>
        <h3 data-ta="FullRTa-DOILabel">DOI</h3>
        <span data-ta="FullRTa-DOI">10.5555/WOS.DETAIL</span>
        <h3 data-ta="FullRTa-publishedLabel">Published</h3>
        <span data-ta="FullRTa-pubdate">FEB 2026</span>
        <h3 data-ta="FullRTa-doctypeLabel">Document Type</h3>
        <span data-ta="FullRTa-doctype-0">Review</span>
      </div>
    </app-full-record>
  </body>
